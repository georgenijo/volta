name: volta
services:
  api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      TESLAMATE_DATABASE_URL: ${TESLAMATE_DATABASE_URL:?set read-only database URL}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?set auth database URL}
      CURRENCY: ${CURRENCY:-USD}
    ports:
      - '${TAILSCALE_IP:?set ubuntu Tailscale IPv4}:8080:8080'
    networks: [teslamate]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    healthcheck:
      test: [CMD, bun, -e, "const r = await fetch('http://127.0.0.1:8080/v1/health'); const j = await r.json(); process.exit(j.ok ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  teslamate:
    external: true
    name: teslamate_default
