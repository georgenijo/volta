# VoltaWidgets: WidgetKit extension (Home Screen + Lock Screen widgets) and
# ActivityKit Live Activities (charging, driving).
#
# Pulled into ios/project.yml via `include: - path: project.widgets.yml`
# (enabled by VOLTA_INCLUDE_WIDGETS, which scripts/ios-build.sh sets).
#
# XcodeGen merges included specs additively (dictionaries merge, arrays
# append), so the `Volta` entry below EXTENDS the app target defined in
# project.yml: it adds the shared sources, embeds the extension and turns on
# Live Activities. project.yml already carries the App Group entitlement.
targets:
  Volta:
    sources:
      - path: VoltaWidgets/Shared    # WidgetSnapshot(+Store), ActivityAttributes
      - path: VoltaWidgets/AppSide   # write(status:…), VoltaLiveActivities
    dependencies:
      - target: VoltaWidgets         # embeds VoltaWidgets.appex
    info:
      properties:
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.georgenijo.volta
            CFBundleURLSchemes: [volta]

  VoltaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: '26.0'
    sources:
      - path: VoltaWidgets/Extension
      - path: VoltaWidgets/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgenijo.volta.widgets
        PRODUCT_NAME: VoltaWidgets
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_VERSION: '6.0'
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: '26.0'
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ""
    info:
      path: VoltaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Volta
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: VoltaWidgets/VoltaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.georgenijo.volta
